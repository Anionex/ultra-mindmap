[project]
name = "ultra-mindmap-backend"
version = "0.1.0"
description = "Ultra MindMap backend — 文本文档生成思维导图"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "python-multipart",
    "openai",
    "langchain-text-splitters",
    "tiktoken",
    "python-docx",
    "pypdf2",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]
